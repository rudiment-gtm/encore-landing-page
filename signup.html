class Component extends DCLogic {
  state = { mode: 'light' };
  renderVals() {
    const mode = this.state.mode;
    let sysDark = false;
    try { sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    const dark = mode === 'dark' || (mode === 'system' && sysDark);
    const pill = (on) => ({
      width: '26px', height: '26px', borderRadius: '999px', cursor: 'pointer', padding: 0,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      border: on ? '1px solid var(--line-strong)' : '1px solid transparent',
      background: on ? 'var(--surface)' : 'transparent', color: on ? 'var(--ink)' : 'var(--ink3)'
    });
    return {
      themeClass: dark ? 'enc-dark' : 'enc-light',
      logoSrc: dark ? '/encore-logo-dark.png' : '/encore-logo.png',
      setLight: () => this.setState({ mode: 'light' }),
      setDark: () => this.setState({ mode: 'dark' }),
      setSystem: () => this.setState({ mode: 'system' }),
      bLight: pill(mode === 'light'), bDark: pill(mode === 'dark'), bSystem: pill(mode === 'system'),
      pLight: String(mode === 'light'), pDark: String(mode === 'dark'), pSystem: String(mode === 'system')
    };
  }
}
</script>

<script>
(function () {
  // Plain, standalone signup handler — deliberately isolated from the DC
  // component above so it works regardless of that framework's own render
  // cycle. Posts straight to the same plg-signup edge function the app's
  // own /get-started page uses, so a lead captured here lands in the exact
  // same place (plg_signups + HubSpot + a real Supabase invite email).
  //
  // Delegated on `document` rather than attached to the form element
  // directly: support.js re-mounts the whole reactive tree after initial
  // parse (even the static parts, since it manages the entire <x-dc> root),
  // which replaces #rSignupForm with a fresh DOM node and silently drops
  // any listener attached to the original one. A delegated listener keyed
  // on id survives that re-mount because it re-queries the DOM at event
  // time instead of holding a stale element reference.
  document.addEventListener('submit', function (e) {
    if (!e.target || e.target.id !== 'rSignupForm') return;
    e.preventDefault();

    var form = e.target;
    var emailInput = document.getElementById('rSignupEmail');
    var btn = document.getElementById('rSignupBtn');
    var errorEl = document.getElementById('rSignupError');
    var successEl = document.getElementById('rSignupSuccess');
    var successText = document.getElementById('rSignupSuccessText');
    var email = emailInput.value.trim();
    if (!email) return;

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Sending…';

    fetch('https://ngfilbqnnhhylgjexfws.supabase.co/functions/v1/plg-signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, redirectTo: 'https://encore-multitenant.vercel.app' })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok || (result.data && result.data.error)) {
          throw new Error((result.data && result.data.error) || 'Could not send the signup link. Please try again.');
        }
        successText.textContent = 'We sent a link to ' + email + '. Click it to activate your 14-day trial.';
        form.style.display = 'none';
        successEl.style.display = 'flex';
      })
      .catch(function (err) {
        errorEl.textContent = err.message || 'Could not send the signup link. Please try again.';
        errorEl.style.display = 'block';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Send sign-up link';
      });
  });
})();
</script>
